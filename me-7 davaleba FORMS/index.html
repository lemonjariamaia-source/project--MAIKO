<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>

    <h2>Contact Us</h2>


      <h4>Full Name</h4>
      <div class="name-fields">
        <div class="name-field">
          <input name="firstName" id="firstName" type="text" autocomplete="given-name" required placeholder="First Name"/> 
          <label for="firstName">First</label>
        </div>
        <div class="name-field">
          <input name="lastName" id="lastName" type="text" autocomplete="family-name" required />
          <label for="lastName">Last:</label>
        </div>
      </div>
  <br>

<label for="Email">Email:</label>
    <br>

    <input type="email" id="Email" required>

    <br>
     <br>
   
    
<div>
    <label for="comment">Leave us few words:</label>
     <input type="text" id="comment">
   </div>

 <br> 
   
      <div class="btns">
      <button type="submit">Submit</button>
      
      
    </div>

   
  </form>
</body>

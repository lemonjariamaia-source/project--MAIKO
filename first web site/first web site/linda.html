<!DOCTYPE html>
<!-- linda.html - Demo page for Linda the owl. Copy the <section class="linda"> block into any page. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linda the owl</title>
  <link rel="stylesheet" href="css/linda.css">
</head>
<body>
    <section class="linda" aria-label="Linda the owl">
    <h2 class="sr-only">Linda the owl</h2>

    <input type="radio" name="linda-lang" id="linda-de" checked>
    <input type="radio" name="linda-lang" id="linda-en">
    <input type="radio" name="linda-lang" id="linda-wd">

    <div class="linda__bubble">
      <p class="linda__msg linda__msg--de" lang="de">Hallo! Ich bin Linda. Lass uns zusammen Deutsch lernen!</p>
      <p class="linda__msg linda__msg--en" lang="en">Hello! I'm Linda. Let's learn English together!</p>
      <p class="linda__msg linda__msg--wd"><strong lang="de">der Apfel</strong> = <span lang="en">the apple</span><br><span class="linda__note" lang="en">Word of the day</span></p>
    </div>

    <div class="linda__stage">
      <svg class="linda__owl" viewBox="0 0 200 220" role="img" aria-label="Linda the owl wearing a graduation cap" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="78" cy="206" rx="16" ry="6" fill="#f5a623"/>
        <ellipse cx="122" cy="206" rx="16" ry="6" fill="#f5a623"/>
        <ellipse cx="100" cy="140" rx="62" ry="64" fill="#8b5e3c"/>
        <ellipse cx="100" cy="152" rx="42" ry="46" fill="#f6e3c4"/>
        <path d="M76 140q5 6 10 0M92 140q5 6 10 0M108 140q5 6 10 0M84 158q5 6 10 0M100 158q5 6 10 0M92 176q5 6 10 0" fill="none" stroke="#d9b98c" stroke-width="2" stroke-linecap="round"/>
        <g class="linda__wing linda__wing--left"><path d="M44 122C22 142 26 182 48 190C60 172 62 142 54 122Z" fill="#6f4528"/></g>
        <g class="linda__wing linda__wing--right"><path d="M156 122C178 142 174 182 152 190C140 172 138 142 146 122Z" fill="#6f4528"/></g>
        <g class="linda__head">
          <ellipse cx="100" cy="86" rx="56" ry="46" fill="#a06b44"/>
          <circle cx="76" cy="84" r="27" fill="#f6e3c4"/>
          <circle cx="124" cy="84" r="27" fill="#f6e3c4"/>
          <g class="linda__eye"><circle cx="76" cy="86" r="14" fill="#5b3a1e"/><circle cx="76" cy="86" r="8" fill="#1d1209"/><circle cx="81" cy="80" r="3.5" fill="#fff"/></g>
          <g class="linda__eye"><circle cx="124" cy="86" r="14" fill="#5b3a1e"/><circle cx="124" cy="86" r="8" fill="#1d1209"/><circle cx="129" cy="80" r="3.5" fill="#fff"/></g>
          <path d="M92 100L108 100L100 116Z" fill="#f5a623"/>
          <ellipse cx="56" cy="104" rx="7" ry="4" fill="#f4a38c" opacity=".6"/>
          <ellipse cx="144" cy="104" rx="7" ry="4" fill="#f4a38c" opacity=".6"/>
          <path d="M80 56L80 66Q100 76 120 66L120 56L100 64Z" fill="#21796f"/>
          <path d="M58 50L100 34L142 50L100 66Z" fill="#2a9d8f"/>
          <path d="M142 50L148 72" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="148" cy="74" r="4" fill="#f5c542"/>
        </g>
      </svg>
    </div>

    <div class="linda__tabs">
      <label for="linda-de">Deutsch</label>
      <label for="linda-en">English</label>
      <label for="linda-wd">Word of the day</label>
    </div>
  </section>
 
</body>
</html>
